[project]
name = "promo-rag"
version = "0.1.0"
description = "Chat assistant for retail promotions: agentic RAG with SQL tools and hybrid search"
readme = "README.md"
authors = [
    { name = "b23shen", email = "b23shen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.4.4",
    "langchain-google-genai>=4.4.1",
    "langfuse>=4.17.0",
    "lxml>=6.1.3",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ingest = "promo_rag.workflows.ingestion.handler:main"
serve = "promo_rag.platform.api:serve"
worker = "promo_rag.platform.worker:main"
search = "promo_rag.search.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# jieba is old code; Python 3.12 warns about its regex strings when it is first compiled.
filterwarnings = ["ignore::SyntaxWarning"]
