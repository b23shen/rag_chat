# Golden question set for search and answer evals.
#
# relevant: page path (under https://www.poya.com.tw) → {grade, quote}.
#   grade: 2 = answers the question, 1 = helps.
#   quote: short exact text from the page (or a list of them). A search result chunk is
#   relevant if it comes from the page and contains a quote; spaces and full/half-width
#   characters are ignored. Pages and quotes, not chunk ids: chunk ids change with every
#   corpus version, but a quote is found in whichever chunk holds it.
#   Empty for unanswerable questions.
# answer: a short reference answer. Not used by the search eval; saved for answer evals later.
# Questions use everyday words, not the page's own wording, so keyword search gets no free help.

as_of: 2026-10-10   # snapshot date: "now" and "this month" mean this date / October 2026

questions:

  # ------------------------------------------------------------------ rule (16)

  - id: rule-01
    category: rule
    lang: zh
    question: 在門市買的東西不想要了，幾天內可以拿去退?
    relevant:
      /law_regulation/5: {grade: 2, quote: "請於七日內(消費後隔日起為第一天)"}
      /faq/8: {grade: 2, quote: "請於七日內(消費後隔日起為第一天)"}
    answer: 7 天內(消費隔天算第 1 天)，帶發票或載具畫面、交易明細和完整未拆封的商品到門市辦理。

  - id: rule-02
    category: rule
    lang: zh
    question: 在門市用折價券買的東西可以退嗎?
    relevant:
      /law_regulation/5: {grade: 2, quote: "折價券購買之商品,恕無法辦理退貨"}
      /faq/8: {grade: 2, quote: "折價券購買之商品,恕無法辦理退貨"}
    answer: 不能退貨，只能換貨。

  - id: rule-03
    category: rule
    lang: en
    question: Can I bring my dog into a POYA store?
    relevant:
      /faq/8: {grade: 2, quote: "請將寵物放進自備的寵物袋"}
    answer: Yes, if the pet is in your own pet bag or pet stroller.

  - id: rule-04
    category: rule
    lang: zh
    question: 寶雅的點數放多久會不見?
    relevant:
      /faq/7: {grade: 2, quote: "隔年12/31失效歸零"}
      /news-detail/321/: {grade: 1, quote: "寶雅點數效期至交易日/歸戶日隔年12/31到期"}
    answer: 當年累積的點數在隔年 12/31 失效，例如 2026 年的點數到 2027/12/31。

  - id: rule-05
    category: rule
    lang: en
    question: How many POYA points do I need to take 1 NT dollar off my bill?
    relevant:
      /faq/7: {grade: 2, quote: "300點可折抵1元"}
    answer: 300 points = NT$1. Points can cover up to 30% of a bill in stores and 15% online.

  - id: rule-06
    category: rule
    lang: zh
    question: 網路上買的東西尺寸不合，可以換一個嗎?
    relevant:
      /faq/6: {grade: 2, quote: "寶雅線上買並無提供換貨服務"}
      /law_regulation/5: {grade: 2, quote: "線上購物僅提供退貨服務"}
    answer: 不行，寶雅線上買不提供換貨，只能退貨。

  - id: rule-07
    category: rule
    lang: en
    question: Can I pay with a Diners Club card at POYA?
    relevant:
      /faq/8: {grade: 2, quote: "無配合大來卡"}
    answer: No. POYA stores do not accept Diners Club (大來卡).
    notes: The page says 大來卡; the English name never appears.

  - id: rule-08
    category: rule
    lang: zh
    question: POYA Pay 一次最少要加值多少? 最多可以放多少錢?
    relevant:
      /law_regulation/4: {grade: 2, quote: "每次最低儲值金額為新台幣$100"}
    answer: 每次最少 $100，儲值上限 $30,000。

  - id: rule-09
    category: rule
    lang: zh
    question: 我想把 POYA Pay 裡面的錢拿回來，要付手續費嗎?
    relevant:
      /law_regulation/4: {grade: 2, quote: "將酌收退還儲值金額之3%手續費"}
    answer: 要。只能全部退，收退款金額 3% 手續費，加現金匯款 $30 和發票寄送 $28。帶身分證件到任一門市辦理。

  - id: rule-10
    category: rule
    lang: en
    question: Can I use a POYA e-voucher at the POYA counter inside a department store?
    relevant:
      /voucher/: {grade: 2, quote: "特殊門市(如百貨門市)及離島門市"}
      /voucher-detail/3: {grade: 2, quote: ["高島屋天母店", "澎湖北辰店"]}
      /news-detail/311/: {grade: 1, quote: "特殊門市(如:百貨門市)及離島門市"}
    answer: No. E-vouchers don't work at special stores such as department-store counters, or at offshore-island stores.

